[project]
name = "brokie"
version = "0.1.0"
description = "The coding agent for people on a budget."
requires-python = ">=3.13"
dependencies = [
    "openai>=2.53.0",
    "orjson>=3.11.9",
    "platformdirs>=4.11.0",
    "prompt-toolkit>=3.0.53",
    "rich>=15.0.0",
]

[project.scripts]
brokie = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main", "config", "functions", "tools"]

[tool.setuptools.data-files]
"" = ["system_prompt.md", "logo.txt"]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Style and formatting rules
    "D401",   # https://docs.astral.sh/ruff/rules/non-imperative-mood/
    "D203",   # https://docs.astral.sh/ruff/rules/incorrect-blank-line-before-class/
    "D213",   # https://docs.astral.sh/ruff/rules/multi-line-summary-second-line/
    "E501",   # https://docs.astral.sh/ruff/rules/line-too-long/
    "COM812", # https://docs.astral.sh/ruff/rules/missing-trailing-comma/

    # Logic and correctness rules
    "BLE001", # https://docs.astral.sh/ruff/rules/blind-except/
    "PLR0911", # https://docs.astral.sh/ruff/rules/too-many-return-statements/
    "S602",   # https://docs.astral.sh/ruff/rules/subprocess-popen-with-shell-equals-true/

    # Other rules
    "T201",   # https://docs.astral.sh/ruff/rules/print/
]
